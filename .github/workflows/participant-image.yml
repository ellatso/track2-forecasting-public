# Executive summary (read this first): build and smoke-check Ella's first Track 2 image,
# then publish the exact linux/amd64 image to GitHub Container Registry for submission.
name: Participant T2 candidate image

on:
  push:
    branches: [submission/t2-coherent]
    paths:
      - 'Dockerfile'
      - 'qfbench2_track_forecasting/**'
      - '.github/workflows/participant-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/ellatso/agenthon-t2:coherent
      - name: Run forecast on the public exemplar
        run: |
          mkdir -p "$RUNNER_TEMP/t2-output"
          chmod 777 "$RUNNER_TEMP/t2-output"
          docker run --rm --network none \
            --read-only --tmpfs /tmp \
            -v "$PWD/units/t2-EXAMPLE-ust-curve-1m:/input:ro" \
            -v "$RUNNER_TEMP/t2-output:/output" \
            ghcr.io/ellatso/agenthon-t2:coherent \
            forecast --panels /input/panels --text /input/text \
            --asof 2024-06-28 --out /output/forecast.parquet
          test -s "$RUNNER_TEMP/t2-output/forecast.parquet"
          test -s "$RUNNER_TEMP/t2-output/forecast_meta.json"
          test -s "$RUNNER_TEMP/t2-output/forecast_rationale.md"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the public admissibility gates
        run: |
          python -m pip install "qfbench2-common[data] @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.4.4.tar.gz#subdirectory=common"
          python -m pip install ".[test]"
          python -m pytest -q tests/test_reference_cli.py tests/test_monthly_reference_cli.py
          python scoring/scoring.py score \
            --card units/t2-EXAMPLE-ust-curve-1m/card.toml \
            --forecast "$RUNNER_TEMP/t2-output/forecast.parquet" \
            | tee "$RUNNER_TEMP/t2-verdict.json"
          python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"t2-verdict.json"); assert json.load(open(p))["admissible"]'
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: |
          docker push ghcr.io/ellatso/agenthon-t2:coherent
          docker buildx imagetools inspect ghcr.io/ellatso/agenthon-t2:coherent
