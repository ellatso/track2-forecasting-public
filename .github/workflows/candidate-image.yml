# Executive summary: test and publish the fixed half-drift variance-mixture candidate.
name: Numeric trial T2 image
on:
  push:
    branches: [submission/t2-ar120-blend50]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'qfbench2_track_forecasting/**'
      - 'tests/test_submission_candidate.py'
      - 'tests/test_mean_blend_submission.py'
      - 'scripts/check_numeric_candidate.py'
      - '.github/workflows/candidate-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned runtime and run candidate regression tests
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pyarrow==18.1.0 jsonschema==4.23.0 requests==2.34.2 pytest ruff==0.4.7
          python -m pip install "qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.4.4.tar.gz#subdirectory=common"
          python -m pip install --no-deps -e .
          python -m ruff check qfbench2_track_forecasting/candidate.py qfbench2_track_forecasting/mean_blend.py qfbench2_track_forecasting/cli.py tests/test_submission_candidate.py scripts/check_numeric_candidate.py
          python -m pytest -q tests/test_mean_blend_submission.py tests/test_submission_candidate.py tests/test_reference_cli.py tests/test_monthly_reference_cli.py tests/test_integrated_agent.py
          for unit in units/*/; do qfbench2 manifest assert-public-safe "$unit"; done
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/ellatso/agenthon-t2:ar120-blend50
      - name: Check every published card in the actual restricted container
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$PWD/units:/units:ro" \
            -v "$PWD/scripts/check_numeric_candidate.py:/verify.py:ro" \
            ghcr.io/ellatso/agenthon-t2:ar120-blend50 \
            python /verify.py --units /units
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exactly the tested image
        run: |
          docker push ghcr.io/ellatso/agenthon-t2:ar120-blend50
          docker buildx imagetools inspect ghcr.io/ellatso/agenthon-t2:ar120-blend50
