# Executive summary: verify the Windows packer syntax and the sealed numeric-trial ZIP.
name: Numeric trial packaging
on:
  push:
    branches: [submission/t2-release-inputs]
    paths: ['participant/pack-release-windows.ps1', 'participant/submission-dev.template.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $syntaxErrors = $null
          $syntaxTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/participant/pack-release-windows.ps1",
            [ref]$syntaxTokens, [ref]$syntaxErrors) | Out-Null
          if ($syntaxErrors.Count -gt 0) { throw ($syntaxErrors | Out-String) }
      - name: Install official packer
        run: python -m pip install "qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.4.4.tar.gz#subdirectory=common"
      - name: Check sealed package with ephemeral synthetic credentials
        shell: python
        run: |
          import json, pathlib, secrets, tempfile, zipfile
          from qfbench2_common.team_claim import pack_submission
          descriptor = json.loads(pathlib.Path("participant/submission-dev.template.json").read_text(encoding="utf-8"))
          assert descriptor["models"] == [] and descriptor["category"] == "api"
          assert descriptor["image"]["repository"] == "ellatso/agenthon-t2"
          with tempfile.TemporaryDirectory() as directory:
              archive = pathlib.Path(directory) / "synthetic-smoke.zip"
              pack_submission(descriptor, 1, secrets.token_hex(32), archive)
              with zipfile.ZipFile(archive) as package:
                  assert set(package.namelist()) == {"submission.json", "team-claim.json"}
                  sealed = json.loads(package.read("submission.json"))
                  assert sealed["image"] == descriptor["image"]
          print("Windows syntax and official ZIP packaging passed; no real Team Key used.")
