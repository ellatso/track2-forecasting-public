# Executive summary: validate research code on supported Python 3.13; publish no scores or images.
name: Research experiments validation
on:
  push:
    branches: [research/t2-experiments]
    paths:
      - 'experiments/**'
      - 'tests/test_*experiments.py'
      - '.github/workflows/research-experiments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned numeric runtime and toolkit
        run: |
          python -m pip install numpy==2.1.3 pandas==2.2.3 pyarrow==18.1.0 jsonschema==4.23.0 requests==2.34.2 pytest ruff==0.4.7 nbformat
          python -m pip install "qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.4.4.tar.gz#subdirectory=common"
      - name: Validate research tests and notebook structure
        run: |
          python -m ruff check experiments tests/test_research_experiments.py tests/test_frequency_experiments.py
          python -m pytest -q tests/test_research_experiments.py tests/test_frequency_experiments.py
          python -c 'import nbformat; n=nbformat.read("experiments/results.ipynb",as_version=4); nbformat.validate(n); assert all(not c.get("outputs") for c in n.cells)'
      - name: Validate frequency notebook
        run: python -c 'import nbformat; n=nbformat.read("experiments/frequency-results.ipynb",as_version=4); nbformat.validate(n); assert all(not c.get("outputs") for c in n.cells)'
      - name: Exercise real Windows PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/experiments/run-windows.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          powershell -ExecutionPolicy Bypass -File "$PWD/experiments/run-windows.ps1" -Phase select -RunDir "$env:RUNNER_TEMP/t2-windows-selection"
          if ($LASTEXITCODE -ne 0) { throw 'Windows selection failed' }
          if (-not (Test-Path "$env:RUNNER_TEMP/t2-windows-selection/selected.json")) { throw 'No candidate lock written' }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/experiments/run-frequency-windows.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          powershell -ExecutionPolicy Bypass -File "$PWD/experiments/run-frequency-windows.ps1" -Phase select -RunDir "$env:RUNNER_TEMP/t2-windows-frequency-selection"
          if ($LASTEXITCODE -ne 0) { throw 'Windows frequency selection failed' }
          if (-not (Test-Path "$env:RUNNER_TEMP/t2-windows-frequency-selection/selected.json")) { throw 'No frequency lock written' }
