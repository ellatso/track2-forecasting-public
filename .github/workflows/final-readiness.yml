# Executive summary: validate preparation code without publishing a Final image or submission.
name: Final preparation checks
on:
  push:
    branches: [research/t2-final-readiness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        run: |
          python -m pip install numpy==2.1.3 scipy==1.15.3 pandas==2.2.3 pyarrow==18.1.0 jsonschema==4.23.0 requests==2.34.2 pytest ruff==0.4.7
          python -m pip install "qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.6.0.tar.gz#subdirectory=common"
          python -m pip install --no-deps -e .
      - name: Lint and validate Final preparation and comparison behavior
        run: |
          python -m ruff check experiments/final_daily.py experiments/compare_final.py qfbench2_track_forecasting/daily_candidate.py qfbench2_track_forecasting/text_candidate.py qfbench2_track_forecasting/text_scenarios.py qfbench2_track_forecasting/house.py qfbench2_track_forecasting/event_timing.py qfbench2_track_forecasting/release_units.py tests/test_final_coverage.py tests/test_house_deadline.py tests/test_event_timing.py tests/test_release_units.py tests/test_comparison_protocol.py scripts/check_text_candidate.py
          OPENBLAS_NUM_THREADS=1 python -m pytest -q tests/test_final_coverage.py tests/test_house_deadline.py tests/test_event_timing.py tests/test_release_units.py tests/test_text_candidate.py tests/test_v12.py tests/test_short_horizon.py tests/test_integrated_agent.py tests/test_comparison_protocol.py --junitxml=unit-tests.xml
      - uses: actions/checkout@v4
        with:
          repository: Agenthon-2026/track2-forecasting-public
          ref: a2c93e7b66b8c6a6c429fda81d6bc7873b7c5dec
          path: official-kit
      - name: Check every previous practice card
        run: |
          for unit in official-kit/units/*/; do qfbench2 manifest assert-public-safe "$unit"; done
          OPENBLAS_NUM_THREADS=1 python scripts/check_text_candidate.py --units official-kit/units
          OPENBLAS_NUM_THREADS=1 python scripts/check_text_candidate.py --units official-kit/units --event-timing --event-clock ecb-ust
      - name: Check the real HTTP transport before building
        run: |
          python -m ruff check scripts/check_final_container.py tests/test_final_transport.py
          OPENBLAS_NUM_THREADS=1 python -m pytest -q tests/test_final_transport.py
      - name: Build a local linux/amd64 image for runtime checks
        run: docker build --platform linux/amd64 -t t2-final-runtime .
      - name: Check every card in a fresh restricted container
        run: |
          OPENBLAS_NUM_THREADS=1 python -m scripts.check_final_container --image t2-final-runtime --units official-kit/units --out "${{ runner.temp }}/t2-final-runtime"
      - name: Retain the runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-check
          path: ${{ runner.temp }}/t2-final-runtime/runtime-report.json
          retention-days: 30
  windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the Windows comparison wrapper
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'experiments/run-final-comparison-windows.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
