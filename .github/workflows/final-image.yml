# Executive summary: test the frozen candidate and publish the exact tested image.
name: Final short-horizon T2 image
on:
  push:
    branches: [submission/t2-final-short-horizon]
    paths:
      - 'Dockerfile'
      - 'ARTIFACT_PROVENANCE.md'
      - 'qfbench2_track_forecasting/**'
      - 'tests/test_short_horizon.py'
      - 'experiments/*.py'
      - '.github/workflows/final-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned runtime and test
        run: |
          python -m pip install numpy==2.1.3 scipy==1.15.3 pandas==2.2.3 pyarrow==18.1.0 jsonschema==4.23.0 requests==2.34.2 pytest ruff==0.4.7
          python -m pip install "qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.6.0.tar.gz#subdirectory=common"
          python -m pip install --no-deps -e .
          python -c 'from experiments import final_study, transfer_short, transfer_deployment'
          python -m ruff check qfbench2_track_forecasting/short_horizon.py qfbench2_track_forecasting/daily_candidate.py qfbench2_track_forecasting/candidate.py experiments/m0_scale.py experiments/final_study.py experiments/transfer_short.py experiments/transfer_deployment.py tests/test_short_horizon.py
          OPENBLAS_NUM_THREADS=1 python -m pytest -q tests/test_short_horizon.py tests/test_precision_candidate.py tests/test_monthly_trend_candidate.py tests/test_submission_candidate.py tests/test_reference_cli.py tests/test_monthly_reference_cli.py tests/test_integrated_agent.py
      - name: Get current official cards at a fixed revision
        uses: actions/checkout@v4
        with:
          repository: Agenthon-2026/track2-forecasting-public
          ref: a2c93e7b66b8c6a6c429fda81d6bc7873b7c5dec
          path: official-kit
      - name: Verify public manifest firewall
        run: |
          for unit in official-kit/units/*/; do qfbench2 manifest assert-public-safe "$unit"; done
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/ellatso/agenthon-t2:final-short-horizon
      - name: Check image configuration and every current card
        run: |
          docker inspect ghcr.io/ellatso/agenthon-t2:final-short-horizon --format '{{json .Config}}' > image-config.json
          python - <<'PY'
          import json
          c=json.load(open('image-config.json'))
          assert not c.get('Volumes'), 'Final forbids Docker VOLUME'
          assert c['Labels']['qfbench2.interface_version']=='2.0'
          assert c['User'] not in ['', 'root', '0']
          PY
          docker run --rm --network none --read-only --tmpfs /tmp \
            -e OPENBLAS_NUM_THREADS=1 \
            -v "$PWD/official-kit/units:/units:ro" \
            -v "$PWD/scripts/check_numeric_candidate.py:/verify.py:ro" \
            ghcr.io/ellatso/agenthon-t2:final-short-horizon \
            python /verify.py --units /units
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exactly the tested image
        run: |
          docker push ghcr.io/ellatso/agenthon-t2:final-short-horizon
          docker buildx imagetools inspect ghcr.io/ellatso/agenthon-t2:final-short-horizon
